# Dependabot: sucht jeden Montag nach Updates und macht dafür Pull Requests.
# Kleine Updates (minor/patch) kommen gesammelt in einem PR, große (major) einzeln.
# Der Workflow "Updates prüfen & mergen" testet sie und mergt sie automatisch.
version: 2
updates:
  - package-ecosystem: "pip"
    directory: "/app"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "05:00"
      timezone: "Europe/Berlin"
    groups:
      python-pakete:
        patterns: ["*"]
        update-types: ["minor", "patch"]
    open-pull-requests-limit: 5

  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "05:00"
      timezone: "Europe/Berlin"
    open-pull-requests-limit: 5
    ignore:
      # Python-Hauptversion (3.12 -> 3.13) nur bewusst wechseln
      - dependency-name: "python"
        update-types: ["version-update:semver-minor", "version-update:semver-major"]

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    groups:
      actions:
        patterns: ["*"]
    open-pull-requests-limit: 5
